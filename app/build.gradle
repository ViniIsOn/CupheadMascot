plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viniison.cupheadmascot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.viniison.cupheadmascot.vertical.v13'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '1.3.1-cinematic'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
