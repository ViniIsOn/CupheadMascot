plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viniison.cupheadmascot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.viniison.cupheadmascot.vertical.v12'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '1.2.2-vertical-fix'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
