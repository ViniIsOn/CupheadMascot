name: Android APK
on:
  push:
    branches: [main, v1.7.3-fast-audio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Instalar Android SDK 35
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android SDK manager não encontrado"; exit 1; fi
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 
      - name: Montar APK debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CupheadMascot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
